                  - heading "The full story" [level=2] [ref=e96]
                  - paragraph [ref=e97]: Declan O'Scanlon of FSD Enterprises presented a proposal to the Henry Hudson Regional PK–12 Board of Education on Sept. 17 to locate a cell‑phone tower on school property. O'Scanlon said the site would help fill local coverage gaps and estimated district revenue from colocation and lease payments "between $50,000 and $180,000 a year," adding that initial contracts are typically five years with renewable terms and modest annual increases.
