                - region "Summary" [ref=e86]:
                  - paragraph [ref=e87]: At the Sept. 17 meeting the board received a public presentation from Declan O'Scanlon of FSD Enterprises proposing a cell-phone tower on district property. O'Scanlon estimated district revenue between $50,000 and $180,000 per year; community members raised health, exposure and potential conflict-of-interest concerns. No board action was taken; the proposal will go to committee and future public hearings.
