version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # Use the HTTPS hostname (nginx + Let's Encrypt cert managed on
            # the EC2 box). Previously this was the raw EC2 public IP over
            # plain HTTP — that meant JWT bearer tokens were sent in cleartext
            # to the API. Going through api.ahnj.info also means IP rotation
            # on instance stop/start no longer requires an amplify.yml edit
            # (DNS is updated by update_api_dns.sh).
            - echo "NEXT_PUBLIC_API_URL=https://api.ahnj.info" > .env.local
            # Google Sign-In client ID. Stored in Amplify env vars (Console →
            # App settings → Environment variables) so it can rotate without
            # a code change. Empty string disables the Google button cleanly.
            - echo "NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}" >> .env.local
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          # NOTE: .next/cache deliberately NOT cached. Next.js's incremental
          # build cache keeps compiled route handlers across builds even when
          # NEXT_PUBLIC_* env vars change in .env.local, which left a stale IP
          # baked into app/api/[...path]/route.js and broke /api/* with 502.
          # Caching node_modules alone still saves ~80% of build time.
          - node_modules/**/*
