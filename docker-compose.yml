services:
  db:
    # Official pgvector image — Postgres 16 with the `vector` extension
    # available (we still need to CREATE EXTENSION on first start, which
    # database.py:_migrate() does on app boot).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlantic_highlands}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-atlantic_highlands}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/${POSTGRES_DB:-atlantic_highlands}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-atlantic-highlands-documents}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOWED_ORIGINS: http://localhost:3000
      # The town this stack serves: municipalities/<MUNICIPALITY>/ at the repo root.
      MUNICIPALITY: ${MUNICIPALITY:-atlantic-highlands-nj}
      MUNICIPALITY_DIR: /municipalities/${MUNICIPALITY:-atlantic-highlands-nj}
    volumes:
      - ./municipalities:/municipalities:ro
    depends_on:
      - db

  web:
    # Repo-root context so the build can read municipalities/<slug>/profile.json.
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        MUNICIPALITY: ${MUNICIPALITY:-atlantic-highlands-nj}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8001
    depends_on:
      - api

volumes:
  pgdata:
